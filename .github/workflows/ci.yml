name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# While the Go tree stays as the parity reference, CI only checks that it
# still builds and its tests pass (docs/architecture.md, CI step 8). The
# Rust gate is in rust.yml. The Go lint, coverage and e2e jobs are gone:
# the Go code is frozen, and decision 54 drops the Go e2e oracle. This file
# goes with the Go tree in the final step (decision 62).
jobs:
  go:
    name: Go reference build and tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
