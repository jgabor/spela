name: Rust

# The Rust gate, on every push and pull request (decision 17). The safety
# rules from AGENTS.md run as tests (crates/spela/tests/safety.rs), so the
# test step is also the grep gate.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Snapshot changes fail the run; they are never written in CI.
  INSTA_UPDATE: "no"

jobs:
  gate:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: gate-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gate-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The wall-clock budgets in release builds. They report their numbers
      # and never fail on time (decision 55).
      - name: Performance budgets (release, report only)
        run: |
          cargo test --release --locked -p spela --test perf -- --ignored --nocapture
          cargo test --release --locked -p spela --test terminal_pty the_tui_enters_and_restores_every_mode -- --nocapture

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-

      - name: Check
        run: cargo +1.89 check --workspace --all-targets --locked

  deny:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Check licences, bans, sources and advisories
        run: cargo deny check
