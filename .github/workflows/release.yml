name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - name: Validate release tag
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release tag: %q\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-tag
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unified binary
        run: |
          go tool mage build
          mv spela spela-linux-amd64

      - name: Create checksums
        run: sha256sum spela-linux-amd64 > checksums.txt

      - name: Extract release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$RELEASE_TAG" > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            spela-linux-amd64
            checksums.txt
          body_path: release_notes.md
