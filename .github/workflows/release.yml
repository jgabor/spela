name: Release

# A pushed vX.Y.Z tag publishes spela-linux-amd64 and checksums.txt, with the
# CHANGELOG section as the notes (docs/releasing.md). Rust releases must stay
# above v0.6.2, the last Go release, or Go users never see the release notice.
# The tag text is untrusted: only validate-tag reads it, through env, and the
# other jobs use its validated output.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - name: Validate release tag
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release tag: %q\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  # fmt, clippy, the tests, the release perf report, MSRV and cargo-deny.
  gate:
    needs: validate-tag
    uses: ./.github/workflows/rust.yml

  build:
    needs: [validate-tag, gate]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
          rustup default stable

      - name: Check the version against the tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "spela") | .version')
          if [ "v$version" != "$RELEASE_TAG" ]; then
            printf 'The tag %s does not match the Cargo version %s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
          newest=$(printf '0.6.2\n%s\n' "$version" | sort -V | tail -n 1)
          if [ "$version" = 0.6.2 ] || [ "$newest" != "$version" ]; then
            printf 'A Rust release must be newer than v0.6.2, the last Go release, not %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      # SPELA_VERSION marks a release build for the release check, which reads
      # it with option_env! (docs/architecture.md, Release check). The binary's
      # own version is the Cargo version, which the step above tied to the tag.
      - name: Build the release binary
        run: |
          SPELA_VERSION="${RELEASE_TAG#v}" cargo build --release --locked -p spela --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/spela spela-linux-amd64

      - name: Create checksums
        run: sha256sum spela-linux-amd64 > checksums.txt

      - name: Extract release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$RELEASE_TAG" > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            spela-linux-amd64
            checksums.txt
          body_path: release_notes.md
