name: DLL Release

# Releases a DLL by hand to jgabor/spela-dlls and adds it to the manifest.
# The asset and the manifest entry use the family's real file name, such as
# nvngx_dlss.dll, which install writes into the game folder. The inputs reach
# the shell only through env, never as ${{ }} in a script.

on:
  workflow_dispatch:
    inputs:
      dll_type:
        description: 'DLL type (dlss, dlssg, dlssd, xess, fsr)'
        required: true
        type: choice
        options:
          - dlss
          - dlssg
          - dlssd
          - xess
          - fsr
      version:
        description: 'Version (e.g., 3.7.20)'
        required: true
        type: string
      dll_url:
        description: 'URL to download the DLL from'
        required: true
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-dll:
    runs-on: ubuntu-24.04
    env:
      DLL_TYPE: ${{ inputs.dll_type }}
      VERSION: ${{ inputs.version }}
      DLL_URL: ${{ inputs.dll_url }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate inputs
        run: |
          case "$DLL_TYPE" in
            dlss) FILENAME=nvngx_dlss.dll ;;
            dlssg) FILENAME=nvngx_dlssg.dll ;;
            dlssd) FILENAME=nvngx_dlssd.dll ;;
            xess) FILENAME=libxess.dll ;;
            fsr) FILENAME=amd_fidelityfx_vk.dll ;;
            *)
              echo "Unknown DLL type" >&2
              exit 1
              ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version format. Expected X.Y or X.Y.Z" >&2
            exit 1
          fi
          if ! [[ "$DLL_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "The DLL URL must be https" >&2
            exit 1
          fi
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the updater
        run: cargo build --locked -p dlss-updater

      - name: Download DLL
        run: |
          mkdir -p dist
          curl --fail --location -o "dist/$FILENAME" "$DLL_URL"

      - name: Calculate SHA256
        id: sha
        run: |
          echo "sha256=$(sha256sum "dist/$FILENAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "dist/$FILENAME")" >> "$GITHUB_OUTPUT"

      - name: Create release in spela-dlls
        env:
          GH_TOKEN: ${{ secrets.DLLS_REPO_TOKEN }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          SIZE: ${{ steps.sha.outputs.size }}
        run: |
          TAG="dll-${DLL_TYPE}-v${VERSION}"
          BODY=$(printf '## %s v%s\n\n%s\n\n**SHA256:** `%s`\n**Size:** %s bytes\n' \
            "$DLL_TYPE" "$VERSION" "$NOTES" "$SHA256" "$SIZE")
          gh release create "$TAG" \
            --repo jgabor/spela-dlls \
            --title "$DLL_TYPE v$VERSION" \
            --notes "$BODY" \
            "dist/$FILENAME"

      - name: Add to the manifest
        run: |
          TAG="dll-${DLL_TYPE}-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
            ./target/debug/dlss-updater add -type "$DLL_TYPE" -version "$VERSION" \
              -file "dist/$FILENAME" \
              -url "https://github.com/jgabor/spela-dlls/releases/download/$TAG/$FILENAME" \
              -notes "$NOTES" -manifest data/manifest.json
            git add data/manifest.json
            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "chore: add $DLL_TYPE v$VERSION to manifest"
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, starting again from main (attempt $attempt)"
            sleep $((attempt * 2))
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
