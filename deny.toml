# cargo-deny: licences, banned crates, sources and advisories.
# Run `cargo deny check`. CI runs every check on every push and pull request.
# The advisories check downloads the RustSec database from GitHub.

[graph]
# spela is Linux only.
targets = ["x86_64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[advisories]
# An ignored advisory needs an id and a reason.
ignore = []

[licenses]
# spela is MIT (decision 15). Dependencies must use a permissive licence.
# MPL-2.0 is allowed for crates used unmodified. No GPL, LGPL or AGPL.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
# The list covers crates later phases add, such as webpki roots with ureq.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no registry version.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    { name = "tokio", reason = "std threads and blocking ureq, no async runtime (decision 11)" },
    { name = "reqwest", reason = "blocking ureq on ring (decision 11)" },
    { name = "openssl-sys", reason = "rustls on ring, no system OpenSSL" },
    { name = "serde_yml", reason = "unsound; read Go's YAML with serde-saphyr" },
    { name = "libyml", reason = "unsound; read Go's YAML with serde-saphyr" },
    { name = "unsafe-libyaml", reason = "unmaintained; read Go's YAML with serde-saphyr" },
    { name = "yaml-rust", reason = "unmaintained; read Go's YAML with serde-saphyr" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
