  title: "Plan: Finish three-zone navigation wiring"

what: >
  Complete the three-zone navigation refactor so internal/nav is the real
  contract across TUI and GUI. Unify settings section schemas, wire context-nav
  section selection to filtered content, port nav transition logic to the GUI,
  collapse TUI nav-state fan-out to a single owner, and remove duplicate
  wrappers and legacy aliases introduced during the shell migration.

why: >
  Thermo-nuclear code quality review found the architecture direction is correct
  (Decision 2) but implementation stopped halfway: settings labels disagree across
  three implementations, section buttons are mostly decorative, GUI skips
  nav.State transition rules, and TUI copies nav state in three places. Finishing
  the wiring prevents drift and makes breadcrumbs and keyboard focus truthful.

constraints: >
  Decision 1 launch model unchanged (Steam %command% only). Decision 2 shell
  (Library/DLL Catalog/Monitor/Settings, scope×aspect, three zones) is firm.
  No behavior regressions in profile inheritance, DLL ops, or existing tests.
  Prefer extending internal/nav over new parallel models. GameDetail.svelte
  god-component split is out of scope unless required for acceptance.

scope:
  included:
    - Canonical settings section + option metadata shared by TUI and GUI
    - SettingsSection and MonitorSection drive filtered content in both surfaces
    - navState.js transition helpers mirroring nav.State methods
    - TUI single-owner nav.State with deleted sync scatter
    - GUI App.svelte routing simplification and ContextNav fixes
    - TUI cleanup (LibrarySection rename, navKeysToContext removal, rail alias removal)
    - Tests proving section filtering and destination transitions
  excluded:
    - GameDetail.svelte decomposition below 1k lines
    - New Wails/codegen pipeline for full Go→JS nav binding (hand-port only this cycle)
    - TODO.md focus-affordance items unrelated to nav wiring
  deferred:
    - Codegen or Wails export of nav.State for zero-drift GUI binding
    - GameDetail aspect routing extraction into dedicated panes

design: >
  Add internal/settings (or extend internal/nav) with one SettingsCatalog:
  ordered sections, stable IDs matching nav.SettingsSection, and option keys
  mapped to config fields. TUI OptionsModalModel and GUI SettingsPane both
  consume this catalog; context-nav section cursor writes nav.State.*Section
  and content panes read it to show one section at a time. Port SelectDestination,
  SelectScope, and SelectAspect to navState.js and route all GUI nav mutations
  through them. In TUI, LayoutModel owns nav.State; contextNav and resourcePane
  receive read-only snapshots or mutating callbacks instead of maintaining copies.
  Monitor splits into GPU/CPU/Alerts views driven by MonitorSection (TUI metrics
  resource + GUI Monitor.svelte). Delete identity wrappers and legacy Resource
  aliases once tests migrate.

