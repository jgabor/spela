decisions:
- number: 1
  date: '2026-04-19'
  question: How to overhaul the TUI (and then the GUI) to fix the accreted UX debt (duplicate model presets, no profile reset,
    unclear default-vs-game relationship, grid misalignment, sequential navigation, Launch-as-tab) and refresh the theme.
  context: 'Ground-up rethink using ASCII mockups. Keystone reframe: 99% of launches go through Steam''s `%command%` (`spela
    %command%`), not the TUI, so the TUI is not a launcher.'
  alternatives: []
  choice: 'TUI becomes a resource-centric configuration and inspection console.


    - Shell: permanent left rail (games · dlls · defaults · metrics), 1-4 hotkeys, right side fills with the active resource
    view.

    - Launch: removed from the TUI entirely. `spela %command%` in Steam is the only launch path.

    - Profile model: live inheritance. Each field is inherited (tracks defaults) or overridden (pinned). `r` resets field,
    `shift+r` resets whole profile, `p` pins current value.

    - Field layout: single-column grouped by subsystem (proton, dlss, gpu, cpu, overlay), groups always visible (no collapse),
    j/k navigates across the whole list.

    - Theme: neon-accent dark. Magenta (#ff5fd2) = override, cyan (#5ff0ff) = focus. Muted greys elsewhere (fg #e8e8f0, fg-muted
    #6a6a80, border #202030, bg #0a0a14). Tokens only; no hardcoded hex in components.

    - DLLs resource: two always-visible sections. Library (inventory of types, latest + cached versions) + Deployment (games
    × DLL types table with per-cell version and stale markers). Per-game DLL state also surfaces inside the Game detail view.'
  reasoning: Launcher-removal is the keystone. Once the TUI is not a launcher, the Launch-tab bug disappears, "resource-centric"
    becomes the obvious spine, and "live inheritance" becomes the obvious default-vs-game model. Grouped-column-no-collapse
    eliminates the 2D-nav problem without losing scannability. Two accents let the theme encode meaning, not ornament. Two-section
    DLL view separates inventory from deployment so neither degenerates at 10+ games.
  confidence: firm
  feeds_into: standalone (decomposition via /planera; GUI parity follows TUI)
- number: 2
  date: '2026-05-23'
  question: How should TUI and GUI navigation be unified after the v0.5.0 resource rail accreted separate surfaces (Games,
    DLLs, Defaults, Metrics, Options modal)?
  context: Approved HTML prototypes (`tmp/spela-nav-*.html`) and shared `internal/nav` model. Default profile is a scope within
    Library, not a peer destination. Settings replaces the options modal.
  alternatives: []
  choice: 'Scope × Aspect shell with three focus zones.


    - **Primary nav (1–4)**: Library, DLL Catalog, Monitor, Settings.

    - **Context nav**: scope list (pinned “All games (default)” + games), aspect tabs (Overview / Profile / DLLs), profile
    subsystem list (Proton → Overlay), plus destination-specific sections (DLL Catalog library/deployment, Monitor GPU/CPU/Alerts,
    Settings groups).

    - **Content**: aspect-specific detail only (no duplicate scope chrome).

    - **Launch**: unchanged from Decision 1 — `spela %command%` in Steam only; no in-app launch control.

    - **Implementation**: `internal/nav` for breadcrumbs and zone keys; TUI three-column layout; GUI `PrimaryNav` + `ContextNav`
    + content panes.'
  reasoning: Separating destination (what app area) from scope (which game or global default) and aspect (what you are doing
    there) removes the Defaults/Games duplication, makes DLL Catalog and Monitor first-class without crowding the game list,
    and keeps keyboard focus predictable.
  confidence: firm
  feeds_into: TUI shell (done), GUI shell parity, DESIGN.md navigation section
