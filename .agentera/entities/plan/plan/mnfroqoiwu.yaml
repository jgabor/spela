    - question: Can the graphical profile and Settings screens be exercised with matching fixture data without the desktop runtime?
      affects_task: 5
      resolve_by: Try the browser fixture setup with scratch fixture data during task 1; if it fails, use component tests and source as evidence and state the limit in every affected metric.
    - question: Did explicit pins that oppose the defaults in real profiles come from user edits or from legacy migration?
      affects_task: 6
      resolve_by: Check the migration rules and their tests against the observed pin pattern.
