    revised: Split the GUI, audit, and synthesis work into smaller tasks; gave every recon item one owning task; added the missing acceptance for hints, heuristics, walkthrough questions, screen space, reference tools, effective values, overlay and restore checks, and the prototype; resolved the basic-key conflict with a measurable bar; made the GUI fixture match the terminal fixture; isolated builds from the working tree; set fixture size; and moved evidence to a durable location.
    title: "Plan: TUI profile and settings UX review"
  what: "Review how users manage game profiles, the All games defaults profile, and Settings in the terminal interface, with the graphical interface measured on the same tasks. Measure task cost and comprehension, confirm or reject the recon defects and observations, price the inherited interaction decisions, and propose two or three simpler interaction models for the user to choose from. The approved design document is docs/design/tui-profile-settings-ux-review-plan.md. Its IDs are used here: defects D1 to D5, observations O1 to O11, inherited decisions G1 to G7, and tasks T1 to T10."
  why: Two earlier rounds made the terminal interface truthful, safe, and reachable with basic keys, but neither measured task cost, comprehension, or information architecture. The user still finds profile and settings management clunky and confusing. A short recon found five contract defects and eleven usability observations, for example a full-screen unsaved-changes dialog on a plain list move and 19 keys to change one field and move on.
  constraints: User direction from 2026-10-14 is binding. Commands keep using only arrows, Tab, Enter, Space, and numbers unless the review meets the stated bar for optional accelerators. Autosave is acceptable for profile fields when reverting a field stays easy. Parity between the terminal and graphical interfaces is a priority, so every alternative defines one shared profile vocabulary and inheritance model. The review changes no product code, tests, or test fixtures in the repository. Builds and scratch fixtures live outside the working tree, and the working tree status is unchanged by the review except for review documents and Agentera state. All walkthroughs use isolated state and fixture games; never approve privileged actions or change real game, profile, or configuration files. Leave the unrelated uncommitted dependency work untouched. Do not push.
  overall_acceptance: GIVEN the review completes WHEN the user reads the report THEN they see, for every listed task, measured costs on the terminal interface and measured costs or a stated limit on the graphical interface; a confirmed defect list tracked as TODOs; the measured cost of each inherited decision; and two or three alternatives that honor their direction, with enough evidence to choose one for a separate implementation plan.
  scope:
    included:
      - Single-game and All games profile editing in the terminal interface, including inheritance display, drafts, saving, reset, and the field editor
      - The terminal Settings destination and the Actions entries that serve profiles or Settings
      - The graphical profile and Settings screens, measured on the same tasks with matching fixture data
      - Field labels, state terms, units, ranges, zero meanings, and restore behavior across terminal, graphical, command-line, stored, and documented forms
      - Terminal sizes 120x40 and 80x24 with hints on and off, and one stated browser viewport for the graphical interface
      - A review report with ranked findings, heuristic ratings, baseline metrics, and alternatives with mock frames
      - Updating the five defect TODOs kjutocdjaz, srryekxvmq, hpuwnhwspr, hxvtaqzzfg, and bdnaynbvan with review findings, and new TODOs for further confirmed defects
    excluded:
      - Implementing any redesign or defect fix
      - DLL, Monitor, and Catalog workflows except shell patterns shared with profiles
      - Real game launches, privileged tuning, live downloads, and real game files
    deferred:
      - The implementation plan for the alternative the user chooses
  design: "Start from one reproducible baseline: recorded builds made outside the working tree, deterministic fixtures that expose every inheritance case on both interfaces, and one durable evidence location. Then run five independent measurement streams: single-game editing, defaults and inheritance, terminal Settings, the graphical interface with Settings parity, and the vocabulary, field metadata, and defect audit. Reconcile the streams before attributing root causes and pricing the inherited decisions. Then write the findings report and metrics, and only after that the alternatives and the decision package. The user's choice opens a separate implementation plan."
