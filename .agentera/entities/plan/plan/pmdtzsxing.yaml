  unknowns:
    - question: Does the GUI get the words through a Wails catalog binding or generated JS?
      affects_task: 5
      resolve_by: Read e2e/fixtures.js, vitest setup, and GetSettingsCatalog; choose the option that keeps frontend tests offline and needs the fewest hand-kept lists, and record the choice.
    - question: Can a default.yaml without an overrides map hold a zero value the user set on purpose, which the All games versus system default rule would call system default?
      affects_task: 1
      resolve_by: Read every MutateDefault caller and the TUI and CLI default writers; if Set always marks the override, the rule is exact for new files, and a stored non-zero value covers old files.
    - question: Which unit ranges are safe to display for clock offset, memory offset, power limit, and fan speed?
      affects_task: 1
      resolve_by: Use the NVML-reported limits or a documented source, name it in the descriptor comment, and show the unit alone when no reliable range exists.
