      - Removal of the Show hints option with tolerance for old config files
      - GUI source column, Follow All games and Set for this game wording, On and Off, labels from the shared table, repair or removal of stale e2e specs
      - docs/profile-fields.md including the missing gpu.vrr row, README, CHANGELOG, and resolving the covered TODOs
