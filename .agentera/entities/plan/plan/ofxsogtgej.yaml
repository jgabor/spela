    title: "Plan: Migrate Beans backlog to Agentera and retire Beans"
  what: Preserve the 21 currently open Beans records as Agentera backlog TODO entities, including drafts and recorded in-progress context. Verify their content and relationships before removing Beans data and operational integrations from this checkout. Execute the migration through this single plan rather than creating competing active plans for imported epics.
  why: Consolidate project work tracking in Agentera without losing outstanding work, source history, requirements, or dependency semantics, and remove the need for Beans in the repository workflow.
  constraints: Use Agentera's supported state writers and CLI readers; never directly edit entity files. Preserve unrelated project state and local settings. Verify a recoverable backup outside the repository before deleting ignored source data. Default to one destination per open bean; require evidence and explicit approval for merges, resolutions, or supersessions. Migration is not authorization to implement the imported work, publish packages, push remotes, or reopen closed work. Do not change vision or objective state.
  overall_acceptance: GIVEN the approved source inventory WHEN migration and cleanup finish THEN all 21 open beans have verified Agentera destinations or explicitly approved dispositions, requirements and relationship semantics remain available, source history is recoverable outside the repository, and no live workflow in this checkout requires Beans. GIVEN an interruption WHEN execution resumes THEN reconciliation prevents duplicate imports and deletion remains blocked until preservation and destination verification pass.
