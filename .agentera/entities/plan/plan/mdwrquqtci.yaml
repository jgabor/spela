    revised: No separate critic run; the user reviewed the plan in plan mode and three read-only exploration agents mapped the draft and save code, navigation, and test churn.
    title: "Plan: TUI profile-first flow with autosave (redesign step 2 of 3)"
  what: Step 2 of the profile and settings redesign (alternative B, TODO qiqoepaeuz). Change how the TUI moves and saves. A game opens on its Profile, the view and the field cursor stay when the game changes, every change is saved at once, Space follows All games and undoes it, and Overview, Ctrl+S, the draft dialog, and the Save and Discard rows are gone. DLLs become the last section, reached with Right from the last Overlay field. Step 3 (GUI parity) gets its own plan.
  why: "The 2026-10-14 UX review found that profile management is slow because of structure (F10 view and cursor reset on every game change, F5 and F6 draft cue and guard, G2 explicit save, G3 reset only in Actions). Step 1 fixed words and display; the measured key counts still cost 22 keys for a preset, 16 for HDR on three games, and 44 to find and undo two values. Design: docs/plans/optimized-munching-zephyr.md. Review: docs/design/tui-profile-settings-ux-review.md sections 4, 10.2, and 11."
  constraints: "User decisions: alternative B with autosave and one-key undo (Space); DLLs a section view reached by Right from the last Overlay field; Overview facts (install directory, prefix, launch option) in a Game block at the top of the DLLs section; Space is a two-state toggle between Follow All games and the own value, and the Enter picker reaches every value including a pinned same value. Work in the clean worktree ~/.cache/spela-step2 on branch feat/tui-profile-flow from main (b21b69b); mage build fails in the main checkout. Change nothing in internal/nav, internal/gui, or the generated nav JS. Leave the user's dependency work and docs/plans/ alone except the plan document this plan names. Never touch ~/.config/spela, ~/.local/share/spela, or ~/.cache/spela; use isolated XDG state and the review jail. No privileged action, no game launch, no push, no commit unless asked. AGENTS.md style applies. The parent owns every Agentera write."
  design: "Keep the save pipeline (profileSaveState, MergeChanges, locked Mutate). DetailModel.UpdateAction returns changed instead of saveRequested; the choke point in pane_actions.go saves whenever changed is true and passes a one-line summary for the message bar. Dirty() only means a write is in flight or failed. loadGameScope keeps the previous aspect (Overview maps to Profile) and ContentModel.SetGame restores the field by key. Overview, the draft dialog, Ctrl+S, Save and Discard rows, and CancelDraft are removed. A three-line header shows game, own settings, and a section strip. Left and Right jump sections through DetailModel.JumpSection; the last section hands over to AspectDLLs. Space toggles follow and own with lastOwn memory; Enter opens the existing editor for numbers and text and a new picker with type-ahead for booleans and enums. A failed save returns the row to the stored value. Quit waits for writes. Settings gets a re-save instead of an input lock. Not taken: a throwaway prototype, one scrolling page for DLLs, alternative C, bulk edit, any nav or GUI change."
  overall_acceptance: GIVEN the review fixture and a build from the worktree WHEN the TUI journeys run with Terminal Control at 120x40 and 80x24 THEN the measured keys are T1 near 2, T1 far 6, T2 10, T5 21, T6 13, T7 10, T10 19, and recon 14 or fewer; AND a game opens on Profile, the view and cursor stay across games, every change writes at once and Space undoes it, Left and Right jump sections and reach DLLs; AND no Ctrl+S binding, Save row, Discard row, draft dialog, or Overview view remains and no key shown in the key bar is dead; AND a failed save shows the stored value and Not saved; AND mage test, mage lint, go test ./tests/..., the e2e suite with Terminal Control 1.2.1, and mage build in the worktree pass; AND the real Spela directories hash the same before and after.
  scope:
    included:
      - Sticky aspect and field cursor, Overview removal, three-line header, section strip, Left and Right section jumps, DLLs section with a Game block
      - Profile autosave, failure revert, status words, message bar summary, Quit waiting for writes, removal of the draft machinery
      - Space toggle with lastOwn, picker with type-ahead, editor without Save, Esc cancel, dynamic key bar, whole-game Follow confirm with a count
      - Settings autosave with a re-save in place of the input lock
      - Unit, e2e, and doc updates for all of the above, CHANGELOG, closing TODOs kjlylvrrvm and xafqoplfhu
    excluded:
      - Any change to internal/nav, internal/gui, the frontend, or the generated nav JS (step 3)
      - GUI autosave and Profile tab first (step 3)
      - One scrolling page for DLLs, alternative C, bulk edit, new accelerators, repair of damaged profile files
      - F19, F20, F21, and the whole-file write race in Config.Save (recorded, not fixed)
    deferred:
      - Locking and merging Config.Save against a simultaneous GUI edit
      - Letting the Game block scroll at 80x24
