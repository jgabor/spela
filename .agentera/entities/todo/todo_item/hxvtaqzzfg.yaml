  kind: task
  target_version: null
  title: Describe profile fields with units, ranges, and effects
  requirements:
    - "Only one of 35 profile field descriptors has a description (gpu.vrr, fields.go:66). The other 34 receive the generated text Configure <Label>. (fields.go:118-121). No code outside fields.go reads the Description field, so no interface shows either kind. Numeric fields show no unit or range: clock offset, memory offset, power limit, fan speed. The TUI Effect line is generic per impact class (detail.go:814-830)."
    - "Give each field a description, unit, range, and the meaning of zero or empty in the descriptor, and render it in both the terminal and graphical interfaces from that one source. Remove the second copy: 19 hint strings in GameProfilePane.svelte, the clock and memory option lists in profileFieldOptions.js (-200..+300 and -500..+1000 MHz), and the GUI field list. docs/profile-fields.md:54-57 already forbids a second list or invented constraints."
    - "Descriptions must say what the code does. Audit findings to state: mode, preset, and frame-generation fields have no launch effect without their override field (apply.go:169-194); power mode (gpu.power_mizer), affinity (cpu.affinity) and six overlay fields have no launch consumer; false booleans add no variable except threaded optimization, which writes 0; clock offset locks the maximum clock to 2100 + value MHz and memory offset locks the maximum memory clock to the value in MHz (nvidia.go:15-28, privileged path not executed; confirm with the author before writing the text)."
    - "Units: clock offset MHz, memory offset MHz, power limit W, fan speed percent. Ranges: fan speed 0 to 100, power limit above 0 within the GPU's own limits, multi-frame 0 to 4 (already enforced). Where a range exists, reject out-of-range values at save time in the TUI, GUI, and CLI (today 150 percent fan speed, -10 W power limit, and -5000 MHz clock offset are accepted and stored)."
    - "Zero and empty: state for each field what a saved 0, false, or empty means at launch (see the D5 TODO for the numeric hardware fields)."
    - Add a test that fails when a descriptor has the generated description, or when a numeric descriptor has no unit and range.
    - Found by the 2026-10-14 recon (defect D4) and widened by the audit field audit.
    - "Reviewed in the 2026-10-14 TUI profile and settings UX review (audit stream: field audit, vocabulary matrix); the review report is docs/design/tui-profile-settings-ux-review.md. Fold this item into the implementation plan for the alternative the user chooses."
  acceptance:
    - GIVEN any profile field WHEN it is selected in either interface THEN its description is visible, and numeric fields show unit and range.
    - GIVEN the same field WHEN viewed in the terminal and graphical interfaces THEN the description text is the same, and it comes from the descriptor.
    - GIVEN a field with no launch consumer WHEN it is shown THEN its description says it has no effect yet, or the field is not offered.
    - GIVEN a numeric field WHEN a value outside its range is saved through the TUI, GUI, or CLI THEN the save is refused and the message names the range.
    - GIVEN a descriptor with the generated description or without unit and range on a numeric field WHEN the test suite runs THEN a test fails.
