record:
  kind: bug
  target_version: null
  title: Show what a zero fan speed means
  requirements:
    - A fan speed of 0 saves as a game override and shows as 0, Override for this game. Launch skips fan speeds of 0 or less (apply.go:69 and :107, apply_profile.go:101), so 0 leaves the fan unchanged and also blocks an inherited fan speed. No interface says so.
    - "Audit result for the other numeric hardware fields: clock offset and memory offset are skipped at exactly 0 (apply.go:66, :98, :101); power limit is skipped at 0 or less (apply.go:68, :104). Negative power limit and fan speed are skipped silently. Negative clock and memory offsets are applied (see the offsets TODO)."
    - "Decide the intended meaning of a saved 0 on these four fields. The audit reads it as: opt this game out of the inherited hardware value. Show that meaning where the value appears: the TUI row and Effect line, the GUI control, CLI gpu show and profile show, and the launch --dry-run Hardware block."
    - "launch --dry-run contradicts itself: Profile impacts lists gpu.fan_speed=0 source=override restore=restorable_mutation while Hardware says no privileged hardware mutation planned (Frostpunk 2 fixture). Make the two blocks agree."
    - "Fix the CLI help for gpu set --fan-speed: it says (0 to clear) but stores an override of 0 (gpu set 526870 --fan-speed 0, then gpu show prints Fan speed: (auto) [override]). Either make 0 reset the field to inherit or reword the help."
    - "Validate at save: reject a negative power limit and fan speed, and a fan speed above 100."
    - The GUI has no control for fan speed or power limit, so their zero case exists in the TUI and CLI only; the clock and memory offsets show 0 MHz in the GUI.
    - Found by the 2026-10-14 recon (defect D5) and confirmed by the audit field audit.
    - "Reviewed in the 2026-10-14 TUI profile and settings UX review (audit stream: field audit, vocabulary matrix); the review report is docs/design/tui-profile-settings-ux-review.md. Fold this item into the implementation plan for the alternative the user chooses."
    - "Step 1 (branch feat/shared-profile-vocabulary, unmerged): the descriptions of clock offset, memory offset, power limit, and fan speed now say that 0 leaves the setting unchanged. Still open: the dry run Hardware block versus Profile impacts disagreement, the gpu set help text, and refusing negative or out-of-range input."
  acceptance:
    - GIVEN defaults with a nonzero fan speed and a game that overrides it with 0 WHEN the game is viewed in either interface THEN the screen states that fan control is left unchanged for that game.
    - GIVEN any numeric profile field with a special zero or negative meaning WHEN it is shown THEN that meaning is visible.
    - GIVEN a game that overrides the inherited clock offset, memory offset, power limit, or fan speed with 0 WHEN launch --dry-run runs THEN the Hardware block and the Profile impacts block agree that nothing is applied for that field.
    - GIVEN gpu set --fan-speed 0 WHEN the help text and the stored result are compared THEN they describe the same behavior.
    - GIVEN a negative power limit or fan speed, or a fan speed above 100 WHEN it is saved through the TUI, GUI, or CLI THEN the save is refused and the message names the valid range.
