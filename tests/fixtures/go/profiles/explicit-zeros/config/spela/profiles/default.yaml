dlss:
    sr_mode: quality
    sr_preset: K
    sr_override: true
    rr_mode: dlaa
    rr_preset: L
    rr_override: true
    fg_enabled: true
    fg_override: true
    multi_frame: 4
    indicator: true
    fg_indicator: true
gpu:
    vrr: automatic
    shader_cache: true
    shader_cache_path: /shader-cache
    threaded_optimization: true
    clock_offset: 120
    memory_offset: 500
    power_limit: 300
    power_mizer: prefer_maximum_performance
    fan_speed: 70
cpu:
    governor: performance
    smt: false
    affinity: 0-7
proton:
    enable_wayland: true
    enable_hdr: true
    enable_ngx_updater: true
    vkd3d_heap: true
overlay:
    enabled: true
    position: top-right
    show_fps: true
    show_frametime: true
    show_cpu: true
    show_gpu: true
    show_vram: true
    toggle_key: F12
overrides:
    cpu.affinity: true
    cpu.governor: true
    cpu.smt: true
    dlss.fg_enabled: true
    dlss.fg_indicator: true
    dlss.fg_override: true
